[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trt-cli"
version = "0.1.0"
description = "TRT - Tool Runtime Terminal: A modular hardware control ecosystem for embedded boards"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "TRT Contributors", email = "contact@trt-project.dev" }
]
keywords = ["cli", "hardware", "embedded", "boards", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Utilities",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.11.0",
    "isort>=5.13.0",
]

[project.scripts]
trt = "trt.cli:main"

[tool.setuptools]
packages = ["trt", "trt.commands", "trt.core", "trt.services"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "W", "I", "UP", "C90", "YTT", "S", "BLE", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "G", "PIE", "T20", "Q"]
ignore = ["E501", "S101"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
py_version = 313
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=src/trt --cov-report=term-missing"
